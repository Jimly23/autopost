[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_BACKEND_URL = "https://automation.bikinkafe.id"
  VITE_API_BASE_URL = "/api"

# Proxy API requests ke backend VPS Laravel
[[redirects]]
  from = "/api/*"
  to = "https://automation.bikinkafe.id/api/:splat"
  status = 200
  force = true

# Proxy Uploads media ke backend VPS Laravel
[[redirects]]
  from = "/uploads/*"
  to = "https://automation.bikinkafe.id/uploads/:splat"
  status = 200
  force = true

# TikTok Developer verification signature file rewrite
[[redirects]]
  from = "*/tiktok-developers-site-verification.txt"
  to = "/tiktok-developers-site-verification.txt"
  status = 200
  force = true

# Single Page Application (SPA) fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
